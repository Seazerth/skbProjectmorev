version: "3.9"

services:

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"       # AMQP
      - "15672:15672"     # RabbitMQ Web UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - homework-network

  sender:
    image: openjdk:21-slim
    container_name: project-app
    command: ["java", "-jar", "/app/sender.jar"]
    volumes:
      - "C:/Users/Morev/Downloads/skbProjectmorev/target/project-0.0.1-SNAPSHOT.jar:/app/sender.jar"
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - APP_QUEUE_NAME=homework.queue
      - APP_EXCHANGE_NAME=homework.exchange
      - APP_ROUTING_KEY=homework.key
    networks:
      - homework-network
    depends_on:
      - rabbitmq

  receiver:
    image: openjdk:21-slim
    container_name: demo-app
    command: ["java", "-jar", "/app/receiver.jar"]
    volumes:
      - "C:/Users/Morev/Downloads/demo/target/demo-0.0.1-SNAPSHOT.jar:/app/receiver.jar"
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - APP_QUEUE_NAME=homework.queue
      - APP_EXCHANGE_NAME=homework.exchange
      - APP_ROUTING_KEY=homework.key
    networks:
      - homework-network
    depends_on:
      - rabbitmq

networks:
  homework-network:
    driver: bridge
