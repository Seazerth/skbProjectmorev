<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заголовки</title>
</head>
<body>
<h1>Заголовки запроса</h1>
<ul>
    <li th:each="header : ${headers}">
        <strong th:text="${header.key}">Header</strong>:
        <span th:text="${header.value}">Value</span>
    </li>
</ul>
</body>
</html>
